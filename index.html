<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>For You 💗</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <!-- =========================
       LOADING
  ========================== -->
  <div id="loadingScreen">
    <div class="loading-text">Loading...</div>
  </div>


  <!-- =========================
       ENVELOPE
  ========================== -->
  <div id="envelope" class="envelope">
    <div class="envelope-back"></div>

    <div class="letter">
      <div class="letter-text">For You</div>
    </div>

    <div class="envelope-front"></div>
  </div>

  <div id="hint">
    Chạm vào chú mèo nhé...
  </div>


  <!-- =========================
       FLOWER EFFECT
  ========================== -->
  <div id="flowerLayer"></div>


  <!-- =========================
       IMAGE VIEWER
  ========================== -->
  <img
    id="viewer"
    src=""
    alt=""
  >


  <!-- =========================
       VIDEO 1
  ========================== -->
  <video
    id="videoViewer"
    playsinline
    webkit-playsinline
    preload="auto"
  >
    <source src="./video.mp4" type="video/mp4">
  </video>


  <!-- =========================
       QUESTION
  ========================== -->
  <div id="questionBox">

    <div id="questionCard">

      <img
        id="questionImage"
        src="./6.png"
        alt=""
      >

      <div class="question-text">
        Tiểu thư có muốn từ chối không?
      </div>

      <div class="question-buttons">

        <button id="yesBtn">
          YESN'T
        </button>

        <button id="noBtn">
          NON'T
        </button>

      </div>

    </div>

  </div>


  <!-- =========================
       IMAGE 7 MESSAGE
  ========================== -->
  <div id="image7Message">
    <div class="image7-text">
      Cảm ơn công chúa đã tham gia 💗
    </div>
  </div>


  <!-- =========================
       ONE MORE
  ========================== -->
  <div id="oneMoreBox">

    <div id="oneMoreText">
      Còn 1 điều nữa...
    </div>

    <button id="oneMoreBtn">
      Xem tiếp
    </button>

  </div>


  <!-- =========================
       VIDEO 2
  ========================== -->
  <video
    id="videoViewer2"
    playsinline
    webkit-playsinline
    preload="auto"
  >
    <source src="./video2.mp4" type="video/mp4">
  </video>


  <!-- =========================
       END
  ========================== -->
  <div id="endBox">
    <div id="endText">
      Hết...
    </div>
  </div>


  <!-- =========================
       CONFESSION
  ========================== -->
  <div id="confessionBox">

    <div class="confession-content">

      <div class="confession-text">
        This is my sincerest confession, with all the love and tenderness I have.
        <br><br>
        Will you let me be yours, once more?
      </div>

      <button id="answerBtn">
        Câu trả lời của em
      </button>

    </div>

  </div>


  <!-- =========================
       ANSWER BOX
  ========================== -->
  <div id="answerBox">

    <div class="answer-content">

      <div class="answer-title">
        Câu trả lời của em...
      </div>

      <textarea
        id="answerInput"
        placeholder="Viết câu trả lời của em ở đây..."
        rows="5"
      ></textarea>

      <button id="sendAnswerBtn">
        Gửi
      </button>

      <div id="answerStatus"></div>

    </div>

  </div>


  <!-- =========================
       MUSIC
  ========================== -->

  <!-- Music 1 -->
  <audio id="bgMusic" preload="auto">
    <source src="./music.mp3" type="audio/mpeg">
  </audio>

  <!-- Music 2 -->
  <audio id="bgMusic2" preload="auto">
    <source src="./music2.mp3" type="audio/mpeg">
  </audio>

  <!-- Music 3 -->
  <audio id="bgMusic3" preload="auto" loop>
    <source src="./music3.mp3" type="audio/mpeg">
  </audio>


  <script src="./script.js"></script>

</body>
</html>
