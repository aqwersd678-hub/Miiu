<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>💗 Một điều nhỏ dành cho em</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================================================
         LOADING
    ========================================================== -->
    <div id="loadingScreen">
        <div class="loadingContent">
            <div class="loadingCat">🐱</div>
            <div class="loadingText">Đang chuẩn bị một chút bất ngờ...</div>
            <div class="loadingBar">
                <div id="loadingProgress"></div>
            </div>
        </div>
    </div>


    <!-- =========================================================
         HINT
    ========================================================== -->
    <div id="hint">
        Chạm vào chú mèo nhé 🐱
    </div>


    <!-- =========================================================
         CAT ENVELOPE
    ========================================================== -->
    <div id="catEnvelope">

        <div class="catWrapper">

            <div class="catEar leftEar"></div>
            <div class="catEar rightEar"></div>

            <div class="catFace">

                <div class="catEye leftEye"></div>
                <div class="catEye rightEye"></div>

                <div class="catNose"></div>

                <div class="catMouth leftMouth"></div>
                <div class="catMouth rightMouth"></div>

                <div class="catWhisker leftWhisker1"></div>
                <div class="catWhisker leftWhisker2"></div>
                <div class="catWhisker rightWhisker1"></div>
                <div class="catWhisker rightWhisker2"></div>

            </div>

            <div class="catBody"></div>

        </div>

        <div class="envelope">
            <div class="envelopeBack"></div>
            <div class="envelopeFront"></div>
            <div class="envelopeFlap"></div>

            <div class="envelopeText">
                💌
            </div>
        </div>

    </div>


    <!-- =========================================================
         FLOWER TRANSITION
    ========================================================== -->
    <div id="flowerLayer"></div>


    <!-- =========================================================
         MAIN VIEWER
    ========================================================== -->
    <main id="viewer">

        <!-- IMAGE VIEW -->
        <div id="imageViewer">

            <img
                id="mainImage"
                src=""
                alt=""
                draggable="false"
            >

            <div id="imageCaption"></div>

        </div>


        <!-- =====================================================
             VIDEO
        ====================================================== -->
        <div id="videoViewerWrapper">

            <video
                id="videoViewer"
                playsinline
                webkit-playsinline
                preload="auto"
                disablepictureinpicture
                controlslist="nodownload nofullscreen noremoteplayback"
            >
                <source
                    src="video.mp4"
                    type="video/mp4"
                >
            </video>

            <!-- Màn che khi video chuyển sang câu hỏi -->
            <div id="videoFade"></div>

        </div>


        <!-- =====================================================
             QUESTION
        ====================================================== -->
        <section id="questionBox">

            <div class="questionCard">

                <img
                    id="questionImage"
                    src="6.png"
                    alt=""
                    draggable="false"
                >

                <div class="questionText">
                    Tiểu thư có muốn từ chối không? 🥺
                </div>

                <div class="questionButtons">

                    <button
                        id="yesBtn"
                        type="button"
                    >
                        YESN'T 💗
                    </button>

                    <button
                        id="noBtn"
                        type="button"
                    >
                        NON'T 😌
                    </button>

                </div>

            </div>

        </section>


        <!-- =====================================================
             IMAGE 7 MESSAGE
        ====================================================== -->
        <section id="image7Message">

            <div class="messageCard">

                <img
                    id="image7"
                    src="7.png"
                    alt=""
                    draggable="false"
                >

                <div id="thanksText">
                    Cảm ơn công chúa đã tham gia 💗
                </div>

            </div>

        </section>


        <!-- =====================================================
             ONE MORE THING
        ====================================================== -->
        <section id="oneMoreBox">

            <div class="oneMoreCard">

                <div class="oneMoreText">
                    Còn 1 điều nữa...
                </div>

                <button
                    id="oneMoreBtn"
                    type="button"
                >
                    Xem tiếp 💗
                </button>

            </div>

        </section>


        <!-- =====================================================
             END
        ====================================================== -->
        <section id="endBox">

            <div class="endCard">

                <div class="endText">
                    Hết... 💗
                </div>

            </div>

        </section>

    </main>


    <!-- =========================================================
         AUDIO
    ========================================================== -->

    <!-- Nhạc giai đoạn đầu -->
    <audio
        id="bgMusic"
        preload="auto"
    >
        <source
            src="music.mp3"
            type="audio/mpeg"
        >
    </audio>


    <!-- Nhạc giai đoạn cuối -->
    <audio
        id="bgMusic2"
        preload="auto"
        loop
    >
        <source
            src="music2.mp3"
            type="audio/mpeg"
        >
    </audio>


    <!-- =========================================================
         SCRIPT
    ========================================================== -->
    <script src="script.js"></script>

</body>
</html>
